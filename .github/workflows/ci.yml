name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - run: npm run build
    # Run the real linters directly instead of `npm run lint`, which chains
    # `update-readme` — Microsoft's tool-doc generator for Microsoft's README
    # structure. This fork maintains its own README, so that generator can't find
    # its expected (options) markers and fails. eslint + tsc are the actual gates.
    - name: Run ESLint
      run: npx eslint . && npx tsc --noEmit
    - name: Ensure no changes
      run: git diff --exit-code

  # This package targets Cloudflare Browser Rendering, which is headless
  # Chromium on Linux — so we only install and test that browser, rather than
  # Microsoft's full chrome/msedge/firefox/webkit × ubuntu/macos/windows matrix.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        # https://github.com/microsoft/playwright-mcp/issues/344
        node-version: '18.19'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Playwright install
      run: npx playwright install --with-deps chromium
    - name: Build
      run: npm run build
    - name: Run tests
      # --project=chromium runs the Chromium suite; grep-invert drops the one
      # test that explicitly launches Firefox to exercise the `browserName`
      # config option (tests/config.spec.ts) — not applicable to our
      # Chromium-only (Browser Rendering) target, and we don't install Firefox.
      run: npm test -- --project=chromium --grep-invert "browserName"

  test_docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Playwright install
      run: npx playwright install --with-deps chromium
    - name: Build
      run: npm run build
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        tags: playwright-mcp-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
    - name: Run tests
      shell: bash
      run: |
        # Used for the Docker tests to share the test-results folder with the container.
        umask 0000
        npm run test -- --project=chromium-docker
      env:
        MCP_IN_DOCKER: 1
