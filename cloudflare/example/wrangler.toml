name = "playwright-mcp-example"
main = "src/index.ts"
# >= 2025-09-01 so workerd serves `node:fs` by default — this server creates its
# screenshot/PDF output directory through it. On an earlier compatibility date,
# add the `enable_nodejs_fs_module` flag instead.
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlaywrightMCP"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "PlaywrightMCP"
